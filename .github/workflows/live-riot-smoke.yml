name: Live Riot Smoke

on:
  workflow_dispatch:
    inputs:
      game_name:
        description: Riot game name
        required: true
        default: AlchemyFlames
      tag_line:
        description: Riot tag line
        required: true
        default: BR1
      platform:
        description: Platform routing value
        required: true
        default: br1
      region:
        description: Match routing region
        required: true
        default: americas
      limit:
        description: Match sample size (1-100)
        required: true
        default: "30"
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-riot-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GAME_NAME: ${{ inputs.game_name || 'AlchemyFlames' }}
      TAG_LINE: ${{ inputs.tag_line || 'BR1' }}
      PLATFORM: ${{ inputs.platform || 'br1' }}
      REGION: ${{ inputs.region || 'americas' }}
      LIMIT: ${{ inputs.limit || '30' }}
    steps:
      - name: Query Riot profile
        shell: bash
        run: |
          node <<'NODE'
          const endpoint="https://bieihhaobdztjyoweewa.supabase.co/functions/v1/public-lol-profile";
          const preferred=Math.min(100,Math.max(1,Number(process.env.LIMIT||30)));
          const attempts=[...new Set([preferred,20,12].filter(x=>x<=preferred))];
          let success=null;
          for(const limit of attempts){
            const body={
              gameName:process.env.GAME_NAME,
              tagLine:process.env.TAG_LINE,
              platform:process.env.PLATFORM,
              region:process.env.REGION,
              limit,
              matchLimit:limit,
              historyDepth:limit
            };
            const res=await fetch(endpoint,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
            const data=await res.json().catch(()=>({}));
            console.log("attempt",limit,"status",res.status,"message",data?.message||data?.error||"");
            if(res.ok){
              success={limit,data};
              break;
            }
          }
          if(!success) throw new Error("all adaptive Riot sample attempts failed");
          const {limit,data}=success;
          console.log("selectedLimit",limit);
          console.log("player",data?.player?.gameName+"#"+data?.player?.tagLine);
          console.log("platform",data?.player?.platform);
          console.log("matches",data?.summary?.matches);
          console.log("champions",Array.isArray(data?.championSummaries)?data.championSummaries.map(x=>x.name+":"+x.games).join(", "):"none");
          console.log("masteryEntries",Array.isArray(data?.mastery)?data.mastery.length:0);
          if(!data?.player?.gameName) throw new Error("missing player");
          if(!Array.isArray(data?.championSummaries)) throw new Error("missing champion summaries");
          if(!Array.isArray(data?.mastery)) throw new Error("missing mastery");
          if((data?.summary?.matches||0)>0){
            const historyEndpoint="https://bieihhaobdztjyoweewa.supabase.co/functions/v1/champion-journey-history";
            const h=await fetch(historyEndpoint,{
              method:"POST",
              headers:{"content-type":"application/json"},
              body:JSON.stringify({gameName:process.env.GAME_NAME,tagLine:process.env.TAG_LINE,platform:process.env.PLATFORM,limit:24})
            });
            const j=await h.json().catch(()=>({}));
            console.log("remoteHistory",h.status,"snapshots",Array.isArray(j?.snapshots)?j.snapshots.length:"invalid");
            if(!h.ok||!Array.isArray(j?.snapshots)||j.snapshots.length===0)throw new Error("trusted server snapshots not available after Riot query");
            if(j.snapshots.some(x=>!x.sampleMatches||!Array.isArray(x.champions)))throw new Error("invalid server snapshot contract");
          }else{
            console.log("No eligible recent matches; history persistence skipped as designed.");
          }
          NODE
