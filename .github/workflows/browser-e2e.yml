name: Browser E2E

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "app.js"
      - "i18n.js"
      - "backend-config.js"
      - "observability.js"
      - "service-worker.js"
      - "manifest.webmanifest"
      - "privacy.html"
      - "live-update.js"
      - "tests/**"
      - "playwright.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/browser-e2e.yml"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Install fast browsers
        if: github.event_name == 'push'
        run: npx playwright install --with-deps chromium

      - name: Install full browser matrix
        if: github.event_name != 'push'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Fast E2E on push
        if: github.event_name == 'push'
        run: npx playwright test --project=chromium --project=mobile-chrome

      - name: Full E2E matrix
        if: github.event_name != 'push'
        run: npm run test:e2e
