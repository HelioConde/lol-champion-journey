name: Visual Snapshot

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL to capture
        required: true
        default: https://helioconde.github.io/lol-champion-journey/
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: visual-snapshot
  cancel-in-progress: false

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture desktop full page
        env:
          SCREENSHOT_WIDTH: 1440
          SCREENSHOT_HEIGHT: 1100
          TARGET_URL: ${{ inputs.url || 'https://helioconde.github.io/lol-champion-journey/' }}
        run: |
          mkdir -p visual-output
          node scripts/capture-full-page.js "$TARGET_URL" visual-output/desktop-full.png

      - name: Capture mobile full page
        env:
          SCREENSHOT_WIDTH: 390
          SCREENSHOT_HEIGHT: 844
          TARGET_URL: ${{ inputs.url || 'https://helioconde.github.io/lol-champion-journey/' }}
        run: |
          node scripts/capture-full-page.js "$TARGET_URL" visual-output/mobile-full.png

      - name: Capture real profile desktop
        env:
          SCREENSHOT_WIDTH: 1440
          SCREENSHOT_HEIGHT: 1100
          WAIT_SELECTOR: "#profile-view"
          SCREENSHOT_DELAY: 2500
          PROFILE_URL: "https://helioconde.github.io/lol-champion-journey/?riotId=AlchemyFlames%23BR1&server=br1&lang=pt-BR"
        run: |
          node scripts/capture-full-page.js "$PROFILE_URL" visual-output/desktop-profile.png

      - name: Capture real profile mobile
        env:
          SCREENSHOT_WIDTH: 390
          SCREENSHOT_HEIGHT: 844
          WAIT_SELECTOR: "#profile-view"
          SCREENSHOT_DELAY: 2500
          PROFILE_URL: "https://helioconde.github.io/lol-champion-journey/?riotId=AlchemyFlames%23BR1&server=br1&lang=pt-BR"
        run: |
          node scripts/capture-full-page.js "$PROFILE_URL" visual-output/mobile-profile.png

      - name: Upload visual artifact
        uses: actions/upload-artifact@v4
        with:
          name: champion-journey-visual-snapshot
          path: visual-output/
          retention-days: 30

      - name: Publish snapshots branch
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -e
          rm -rf /tmp/visual-output
          cp -r visual-output /tmp/visual-output

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin visual-snapshots >/dev/null 2>&1; then
            git fetch origin visual-snapshots
            git switch visual-snapshots
          else
            git switch --orphan visual-snapshots
            git rm -rf . || true
          fi

          mkdir -p latest history
          cp /tmp/visual-output/desktop-full.png latest/desktop-full.png
          cp /tmp/visual-output/desktop-full.json latest/desktop-full.json
          cp /tmp/visual-output/mobile-full.png latest/mobile-full.png
          cp /tmp/visual-output/mobile-full.json latest/mobile-full.json
          cp /tmp/visual-output/desktop-profile.png latest/desktop-profile.png
          cp /tmp/visual-output/desktop-profile.json latest/desktop-profile.json
          cp /tmp/visual-output/mobile-profile.png latest/mobile-profile.png
          cp /tmp/visual-output/mobile-profile.json latest/mobile-profile.json

          STAMP="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          mkdir -p "history/$STAMP"
          cp /tmp/visual-output/* "history/$STAMP/"

          cat > latest/source.json <<EOF
          {
            "sourceSha": "$SOURCE_SHA",
            "workflowRunId": "$RUN_ID",
            "capturedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

          git add latest history
          git commit -m "chore: visual snapshot $STAMP" || exit 0
          git push origin visual-snapshots
