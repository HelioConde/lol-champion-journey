name: Static QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax
        run: |
          node --check app.js
          node --check i18n.js
          node --check backend-config.js
          node --check observability.js
          node --check service-worker.js

      - name: Required Champion Journey markers
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          test -f i18n.js
          test -f backend-config.js
          test -f README.md
          test -f ADS_SETUP.md
          test -f RIOT_API.md
          test -f SNAPSHOT_CONTRACT.md
          test -f observability.js
          test -f service-worker.js
          test -f icon.svg
          test -f icon-maskable.svg
          test -f supabase/schema/champion-journey-snapshots.sql
          test -f live-update.js
          test -f version.json
          test -f tests/e2e.spec.js

          grep -qi 'lang="pt-BR"' index.html
          grep -qi 'data-language="en"' index.html
          grep -qi 'id="search-form"' index.html
          grep -qi 'id="champion-hero"' index.html
          grep -qi 'id="champion-list"' index.html
          grep -qi 'id="snapshot-comparison"' index.html
          grep -qi 'id="champion-comparison"' index.html
          grep -qi 'id="share-native"' index.html
          grep -qi 'rel="canonical"' index.html
          grep -qi 'not endorsed\|não é endossado' index.html
          grep -qi 'id="download-card"' index.html
          grep -qi 'id="copy-link"' index.html
          grep -qi 'id="refresh-data"' index.html
          grep -qi 'id="recent-searches"' index.html
          grep -qi 'ad-slot' index.html

          grep -qi 'public-lol-profile' backend-config.js
          grep -qi 'CHAMPION_JOURNEY_BACKEND' backend-config.js
          grep -qi 'loadDDragonCatalog' app.js
          grep -qi 'championId' app.js
          grep -qi 'saveSnapshot' app.js
          grep -Fq '$(".champion-chip").forEach' app.js
          ! grep -Fq '$(".champion-chip").forEach' app.js
          grep -qi 'championConsistency' app.js
          grep -qi 'navigator.share' app.js
          grep -qi 'serviceWorker' app.js
          grep -qi 'renderSnapshotComparison' app.js
          grep -qi 'URLSearchParams' app.js
          grep -qi 'canvas.toDataURL' app.js
          grep -qi 'navigator.clipboard' app.js
          grep -qi 'cj:recent' app.js
          grep -qi 'cj:snapshots:' app.js
          grep -qi 'DADOS RIOT' i18n.js
          grep -qi 'DEMONSTRAÇÃO' i18n.js

      - name: No secrets
        run: |
          ! grep -RniE 'RGAPI-[A-Za-z0-9_-]{20,}|SUPABASE_SERVICE_ROLE_KEY|service_role.*eyJ' . \
            --exclude-dir=.git \
            --include='*.js' \
            --include='*.html' \
            --include='*.json' \
            --include='*.yml' \
            --include='*.yaml' \
            --exclude='package*.json' \
            --exclude='static-qa.yml'
