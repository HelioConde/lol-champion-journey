name: Live version
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "app.js"
      - "i18n.js"
      - "backend-config.js"
      - "observability.js"
      - "service-worker.js"
      - "manifest.webmanifest"
      - "icon.svg"
      - "icon-maskable.svg"
      - "privacy.html"
      - "live-update.js"
permissions: { contents: write }
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: printf '{"sha":"%s","publishedAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json
      - run: |
          if git diff --quiet -- version.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: refresh live version"
          git push
